<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecionando...</title>
    
    <!-- GitHub Pages SPA Redirect -->
    <script type="text/javascript">
      // GitHub Pages Redirect para SPA
      // Converte /criador-horario-backend/login em /criador-horario-backend/?/login
      (function(){
        var pathSegmentsToKeep = 1; // Mantém /criador-horario-backend/
        
        var l = window.location;
        var segments = l.pathname.split('/').filter(Boolean);
        
        // Se temos mais segmentos que o base path, redireciona
        if (segments.length > pathSegmentsToKeep) {
          var basePath = '/' + segments.slice(0, pathSegmentsToKeep).join('/');
          var route = '/' + segments.slice(pathSegmentsToKeep).join('/');
          
          l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            basePath + '/?/' + route.slice(1).replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <p style="text-align: center; padding: 50px; font-family: Arial;">Redirecionando...</p>
  </body>
</html>
