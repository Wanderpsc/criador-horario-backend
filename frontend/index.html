<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Criador de Horário de Aula Escolar</title>
  <meta name="description" content="Sistema completo para criação automática de horários escolares">
  <meta name="author" content="Wander Pires Silva Coelho">
  
  <!-- GitHub Pages SPA Redirect Fix -->
  <script type="text/javascript">
    // Restaura a rota salva pelo 404.html
    (function() {
      var savedPath = sessionStorage.getItem('path');
      if (savedPath) {
        sessionStorage.removeItem('path');
        window.history.replaceState(null, null, savedPath);
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
