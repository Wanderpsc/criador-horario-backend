  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json?v=20261111">
  <script>
    (function () {
      // Três identidades de aplicativo: gestão (admin), ponto e substituição.
      // No iPhone o manifest é gerado na hora com o link exato aberto (start_url),
      // porque o app instalado não compartilha armazenamento com o Safari.
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

      function resolveContext() {
        var hash = location.hash;
        if (hash.indexOf('#/substitute/') === 0) return 'substitute';
        if (/^#\/(ponto|ponto-geral|ponto-teacher)\//.test(hash)) return 'ponto';
        if (!hash) {
          if (/(?:\?|&)shortcut=substitute(?:&|$)/.test(location.search)) return 'substitute';
          if (/(?:\?|&)app=ponto(?:&|$)/.test(location.search)) return 'ponto';
        }
        return 'admin';
      }

      function buildDynamicManifest(substitute) {
        var origin = location.origin;
        var startUrl = origin + '/?' + (substitute ? 'shortcut=substitute' : 'app=ponto');
        if (location.hash) startUrl += '&dest=' + encodeURIComponent(location.hash);
        var iconBase = origin + (substitute ? '/substitute-icon-' : '/icon-');
        var iconVersion = substitute ? '?v=20261010' : '?v=20261009-1';
        var manifest = {
          id: startUrl,
          name: substitute ? 'Substituição de Professor' : 'Ponto Eletrônico EduSync',
          short_name: substitute ? 'Substituição' : 'Ponto',
          description: substitute
            ? 'Atalho para o link de substituição de professor da escola'
            : 'Registro de ponto de professores e funcionários',
          start_url: startUrl,
          scope: origin + '/',
          display: 'standalone',
          background_color: substitute ? '#f0fdf4' : '#ffffff',
          theme_color: substitute ? '#047857' : '#2563eb',
          lang: 'pt-BR',
          icons: [
            { src: iconBase + '192.png' + iconVersion, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
            { src: iconBase + '512.png' + iconVersion, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };
        return 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
      }

      function manifestHref(context) {
        if (context === 'admin') return '/manifest.json?v=20261111';
        var substitute = context === 'substitute';
        if (isIOS) return buildDynamicManifest(substitute);
        return substitute ? '/substitute-manifest.json?v=20261010' : '/ponto-manifest.json?v=20261111';
      }

      function configureShortcut() {
        var context = resolveContext();
        var manifestLink = document.querySelector('link[rel="manifest"]');
        var href = manifestHref(context);
        if (manifestLink.getAttribute('href') === href) return;
        manifestLink.setAttribute('href', href);
        var substitute = context === 'substitute';
        document.querySelector('link[rel="apple-touch-icon"]').setAttribute('href',
          substitute ? '/substitute-icon-192.png?v=20261010' : '/icon-192.png?v=20261009-1');
        document.querySelector('link[rel="icon"]').setAttribute('href',
          substitute ? '/substitute-icon.svg' : '/icon.svg');
        document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content',
          context === 'admin' ? 'EduSync-PRO' : substitute ? 'Substituição' : 'Ponto');
        document.querySelector('meta[name="theme-color"]').setAttribute('content',
          substitute ? '#047857' : context === 'ponto' ? '#2563eb' : '#3b82f6');
        window.dispatchEvent(new Event('pwa-install-context-changed'));
      }

      configureShortcut();
      window.addEventListener('hashchange', configureShortcut);
    }());
  </script>
  
  <!-- GitHub Pages SPA Redirect Handler -->
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // Este script processa o redirecionamento do 404.html
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
