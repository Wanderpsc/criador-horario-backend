<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecionando...</title>
    
    <!-- GitHub Pages SPA Redirect -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Salva a rota no sessionStorage e redireciona para index.html
      sessionStorage.setItem('path', window.location.pathname + window.location.search + window.location.hash);
      window.location.replace(window.location.origin + '/criador-horario-backend/');
    </script>
  </head>
  <body>
    <p style="text-align: center; padding: 50px; font-family: Arial;">Redirecionando...</p>
  </body>
</html>
