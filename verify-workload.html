    async function loadData() {
      const statusEl = document.getElementById('status');
      const contentEl = document.getElementById('content');
      
      try {
        statusEl.innerHTML = '⏳ Buscando dados do servidor...';
        statusEl.style.background = '#e3f2fd';
        
        const response = await fetch(API_URL);
        
        if (!response.ok) {
          throw new Error(`Erro HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        
        if (!data.success) {
          throw new Error(data.error || 'Erro desconhecido na API');
        }

        statusEl.innerHTML = `✅ ${data.data.length} turmas encontradas`;
        statusEl.style.background = '#d4edda';

        let html = '';
        
        for (const classData of data.data) {
          const expected = expectedData[classData.class];
          html += `<div class="turma">`;
          html += `<h2>${classData.class}</h2>`;
          html += `<table>`;
          html += `<tr><th>Componente Curricular</th><th>CH Cadastrada</th><th>CH Esperada</th><th>Status</th></tr>`;
          
          let totalCadastrada = 0;
          let totalEsperada = 0;
          
          // Criar mapa de componentes cadastrados
          const cadastrados = {};
          for (const subject of classData.subjects) {
            cadastrados[subject.name] = subject.weeklyHours;
            totalCadastrada += subject.weeklyHours;
          }
          
          // Se temos dados esperados, comparar
          if (expected) {
            // Calcular total esperado
            for (const hours of Object.values(expected)) {
              totalEsperada += hours;
            }
            
            // Verificar cada disciplina esperada
            for (const [nome, horasEsperadas] of Object.entries(expected)) {
              const horasCadastradas = cadastrados[nome] || 0;
              const match = horasCadastradas === horasEsperadas;
              const status = match ? '✅' : '❌';
              const rowClass = match ? 'success' : 'error';
              
              html += `<tr class="${rowClass}">`;
              html += `<td>${nome}</td>`;
              html += `<td>${horasCadastradas}</td>`;
              html += `<td>${horasEsperadas}</td>`;
              html += `<td>${status}</td>`;
              html += `</tr>`;
              
              delete cadastrados[nome];
            }
            
            // Mostrar disciplinas cadastradas que não estão na planilha
            for (const [nome, horas] of Object.entries(cadastrados)) {
              html += `<tr class="error">`;
              html += `<td>${nome}</td>`;
              html += `<td>${horas}</td>`;
              html += `<td>-</td>`;
              html += `<td>⚠️ NÃO ESTÁ NA PLANILHA</td>`;
              html += `</tr>`;
            }
            
            const totalMatch = totalCadastrada === totalEsperada;
            html += `<tr class="total ${totalMatch ? 'success' : 'error'}">`;
            html += `<td>TOTAL</td>`;
            html += `<td>${totalCadastrada}</td>`;
            html += `<td>${totalEsperada}</td>`;
            html += `<td>${totalMatch ? '✅' : '❌'}</td>`;
            html += `</tr>`;
          } else {
            // Sem dados esperados, apenas mostrar o que está cadastrado
            for (const subject of classData.subjects) {
              html += `<tr>`;
              html += `<td>${subject.name}</td>`;
              html += `<td>${subject.weeklyHours}</td>`;
              html += `<td colspan="2">⚠️ Sem dados para comparação</td>`;
              html += `</tr>`;
            }
            html += `<tr class="total">`;
            html += `<td>TOTAL</td>`;
            html += `<td>${totalCadastrada}</td>`;
            html += `<td colspan="2">-</td>`;
            html += `</tr>`;
          }
          
          html += `</table>`;
          html += `</div>`;
        }
        
        document.getElementById('content').innerHTML = html || '<p>Nenhum dado encontrado</p>';
      } catch (error) {
        const statusEl = document.getElementById('status');
        statusEl.innerHTML = `❌ Erro: ${error.message}`;
        statusEl.style.background = '#f8d7da';
        
        document.getElementById('content').innerHTML = `
          <div style="padding: 20px; background: #fff3cd; border-radius: 5px; margin-top: 20px;">
            <h3>⚠️ Detalhes do Erro:</h3>
            <p><strong>Mensagem:</strong> ${error.message}</p>
            <p><strong>URL tentada:</strong> ${API_URL}</p>
            <h4>Possíveis soluções:</h4>
            <ol>
              <li>Verifique se o servidor backend está rodando (localhost:5000)</li>
              <li>Aguarde alguns minutos se estiver usando a URL do Render</li>
              <li>Verifique o console do navegador (F12) para mais detalhes</li>
            </ol>
          </div>
        `;
        console.error('Erro detalhado:', error);
      }
    }

    loadData();
  </script>
</body>
</html>
